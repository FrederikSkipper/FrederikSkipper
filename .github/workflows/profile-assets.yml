name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # GitHub contribution snake
      # --------------------------------------------------

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FrederikSkipper
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      # --------------------------------------------------
      # Real contribution calendar / heatmap
      # --------------------------------------------------

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics-calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: FrederikSkipper

          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1

          config_timezone: Europe/Copenhagen

          output_action: none

      # --------------------------------------------------
      # Commit generated assets
      # --------------------------------------------------

      - name: Commit profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-snake.svg
          git add github-snake-dark.svg
          git add assets/metrics-calendar.svg

          git diff --cached --quiet || git commit -m "chore: update profile assets"

          git push
