
name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # Generate GitHub contribution snake
      # ==================================================

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FrederikSkipper
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # ==================================================
      # Generate contribution calendar
      # ==================================================

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics-calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: FrederikSkipper

          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1

          config_timezone: Europe/Copenhagen

          output_action: none

      # ==================================================
      # Copy generated assets into repository
      # ==================================================

      - name: Install generated assets
        run: |
          mkdir -p assets

          cp dist/github-snake.svg ./github-snake.svg
          cp dist/github-snake-dark.svg ./github-snake-dark.svg
          cp dist/metrics-calendar.svg ./assets/metrics-calendar.svg

      # ==================================================
      # Commit generated files
      # ==================================================

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-snake.svg
          git add github-snake-dark.svg
          git add assets/metrics-calendar.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile assets [skip github actions]"
            git push
          fi
